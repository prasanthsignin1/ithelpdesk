<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iBridge Techsoft — IT Helpdesk</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root{
  --bg:#EEF1F6;
  --surface:#FFFFFF;
  --surface-alt:#F4F6F9;
  --ink:#131A2B;
  --ink-soft:#5B6478;
  --ink-faint:#8B93A6;
  --border:#DEE3EA;
  --border-soft:#EAEDF2;
  --accent:#0F6E56;
  --accent-dark:#0A5343;
  --accent-soft:#E1F1EC;
  --critical:#B3261E; --critical-soft:#FBE7E6;
  --high:#C2600B; --high-soft:#FCEEDF;
  --medium:#8A6D06; --medium-soft:#FBF3D8;
  --low:#3E7A57; --low-soft:#E7F3EC;
  --st-open:#1D5DBF; --st-open-soft:#E4EDFB;
  --st-prog:#B4740B; --st-prog-soft:#FBF0DC;
  --st-next:#6A3FB0; --st-next-soft:#EFE7FB;
  --st-res:#227A4B; --st-res-soft:#E1F2E8;
  --st-closed:#5B6478; --st-closed-soft:#E7E9EE;
  --font-mono:'IBM Plex Mono', ui-monospace, monospace;
  --font-sans:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --radius:10px;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
}
button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
button{ cursor:pointer; }
::selection{ background:var(--accent-soft); }

.shell{ display:flex; min-height:100vh; }

/* ---------- Sidebar ---------- */
.sidebar{
  width:216px; flex-shrink:0; background:var(--ink); color:#EDEFF4;
  display:flex; flex-direction:column; padding:20px 14px;
}
.brand{ display:flex; align-items:center; gap:9px; padding:2px 8px 22px; }
.brand-mark{
  width:30px;height:30px;border-radius:7px;background:#fff;
  display:flex;align-items:center;justify-content:center; flex-shrink:0; padding:3px;
}
.brand-mark img{ width:100%; height:100%; object-fit:contain; }
.brand-name{ font-weight:600; font-size:14px; letter-spacing:0.1px; line-height:1.25; }
.brand-sub{ font-family:var(--font-mono); font-size:9.5px; color:#8B93A6; letter-spacing:0.5px; }

.nav-group{ margin-bottom:16px; }
.nav-label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:0.8px; color:#6B7385;
  padding:6px 10px 6px; font-weight:600;
}
.nav-item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  background:none; border:none; color:#C7CBD8; padding:8px 10px; border-radius:7px;
  font-size:13.3px; margin-bottom:2px; transition:background .12s;
}
.nav-item:hover{ background:rgba(255,255,255,0.06); color:#fff; }
.nav-item.active{ background:var(--accent); color:#fff; }
.nav-dot{ width:6px;height:6px;border-radius:50%; background:#5B6478; flex-shrink:0; }
.nav-item.active .nav-dot{ background:#fff; }

.sidebar-foot{ margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,0.08); }
.role-card{ font-size:11.5px; color:#8B93A6; padding:6px 10px; }
.role-card b{ color:#EDEFF4; display:block; font-size:13px; margin-bottom:1px; }

/* ---------- Main ---------- */
.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{
  height:58px; background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; padding:0 22px; flex-shrink:0;
  position:sticky; top:0; z-index:20;
}
.topbar-title{ font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topbar-sub{ font-size:12px; color:var(--ink-soft); margin-top:1px; }
.topbar-right{ display:flex; align-items:center; gap:10px; }

.role-switch{ position:relative; }
.role-btn{
  display:flex; align-items:center; gap:7px; background:var(--surface-alt);
  border:1px solid var(--border); padding:6px 10px 6px 8px; border-radius:8px; font-size:12.5px;
}
.avatar{
  width:22px;height:22px;border-radius:50%; background:var(--accent-soft); color:var(--accent-dark);
  display:flex;align-items:center;justify-content:center; font-size:10.5px; font-weight:600; font-family:var(--font-mono);
}
.dropdown{
  position:absolute; top:calc(100% + 6px); right:0; background:var(--surface); border:1px solid var(--border);
  border-radius:9px; box-shadow:0 8px 24px rgba(19,26,43,0.14); min-width:190px; padding:6px; z-index:40; display:none;
}
.dropdown.open{ display:block; }
.dropdown-item{
  display:block; width:100%; text-align:left; padding:8px 10px; border-radius:6px; background:none; border:none; font-size:12.8px;
}
.dropdown-item:hover{ background:var(--surface-alt); }
.dropdown-item.active{ color:var(--accent-dark); font-weight:600; }

.bell{ position:relative; width:34px;height:34px; border-radius:8px; border:1px solid var(--border); background:var(--surface-alt); display:flex; align-items:center; justify-content:center; }
.bell-badge{ position:absolute; top:-3px; right:-3px; background:var(--critical); color:#fff; font-size:9.5px; font-family:var(--font-mono); border-radius:8px; padding:1px 4px; min-width:14px; text-align:center; }
.notif-panel{ width:300px; max-height:360px; overflow-y:auto; }
.notif-item{ padding:9px 10px; border-radius:6px; }
.notif-item:hover{ background:var(--surface-alt); }
.notif-text{ font-size:12.3px; color:var(--ink); }
.notif-time{ font-size:10.8px; color:var(--ink-faint); margin-top:2px; font-family:var(--font-mono); }

.content{ padding:22px 26px 60px; max-width:1180px; }

/* ---------- Generic bits ---------- */
.page-head{ margin-bottom:18px; }
.page-title{ font-size:19px; font-weight:600; margin:0 0 3px; }
.page-desc{ font-size:12.8px; color:var(--ink-soft); margin:0; }

.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; overflow-x:auto; }
.card table{ min-width:640px; }
.grid{ display:grid; gap:14px; }
.grid-4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
.grid-2{ grid-template-columns:repeat(2,minmax(0,1fr)); }

.nav-toggle{ display:none; }
.sidebar-backdrop{ display:none; }

@media (max-width:900px){
  .nav-toggle{ display:flex; align-items:center; justify-content:center; width:36px;height:36px; border-radius:8px; border:1px solid var(--border); background:var(--surface-alt); margin-right:10px; flex-shrink:0; }
  .sidebar{
    position:fixed; top:0; left:0; height:100vh; z-index:70;
    transform:translateX(-100%); transition:transform .22s ease;
  }
  .sidebar.open{ transform:translateX(0); box-shadow:10px 0 30px rgba(19,26,43,0.3); }
  .sidebar-backdrop{ display:block; position:fixed; inset:0; background:rgba(19,26,43,0.45); z-index:60; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .sidebar-backdrop.open{ opacity:1; pointer-events:auto; }
  .main{ width:100%; min-width:0; }
}
@media (max-width:640px){
  .topbar{ padding:0 14px; gap:8px; }
  .topbar-title{ font-size:14.5px; }
  .topbar-sub{ display:none; }
  .topbar-right{ gap:6px; }
  .role-btn{ padding:6px 8px; }
  .role-btn .role-btn-label{ display:none; }
  .logout-btn .logout-label{ display:none; }
  .logout-btn{ padding:6px 8px; }
}
@media (max-width:720px){
  .grid-4{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .grid-2{ grid-template-columns:1fr; }
  .content{ padding:16px 14px 60px; }
  .detail-grid{ grid-template-columns:1fr !important; }
  .filters{ flex-direction:column; align-items:stretch; }
  .filters input, .filters select{ width:100%; }
  .filters button{ margin-left:0 !important; }
}

.modal-overlay{ position:fixed; inset:0; background:rgba(19,26,43,0.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
.modal-card{ background:var(--surface); border-radius:12px; padding:22px 24px; width:100%; max-width:400px; box-shadow:0 20px 50px rgba(19,26,43,0.25); }
.modal-title{ font-size:15.5px; font-weight:600; margin-bottom:8px; }
.modal-message{ font-size:12.8px; color:var(--ink-soft); line-height:1.6; margin-bottom:14px; white-space:pre-line; }
.modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
.modal-copybox{ font-family:var(--font-mono); font-size:14px; font-weight:600; background:var(--accent-soft); color:var(--accent-dark); border-radius:7px; padding:10px 12px; text-align:center; letter-spacing:0.5px; margin-bottom:6px; user-select:all; }

.stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; }
.stat-num{ font-family:var(--font-mono); font-size:26px; font-weight:600; line-height:1; margin-bottom:6px; }
.stat-label{ font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; font-weight:600; }
.stat-card.st-open .stat-num{ color:var(--st-open); }
.stat-card.st-prog .stat-num{ color:var(--st-prog); }
.stat-card.st-next .stat-num{ color:var(--st-next); }
.stat-card.st-res .stat-num{ color:var(--st-res); }

.btn{
  display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:7px; border:1px solid var(--border);
  background:var(--surface); font-size:12.8px; font-weight:500; color:var(--ink);
}
.btn:hover{ border-color:var(--ink-faint); }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-primary:hover{ background:var(--accent-dark); border-color:var(--accent-dark); }
.btn-danger{ background:var(--critical-soft); border-color:var(--critical-soft); color:var(--critical); }
.btn-sm{ padding:5px 10px; font-size:11.8px; border-radius:6px; }
.btn-block{ width:100%; justify-content:center; }
.btn[disabled]{ opacity:0.45; cursor:not-allowed; }

.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
.field .req{ color:var(--critical); }
.field input[type=text], .field input[type=password], .field input[type=file], .field select, .field textarea{
  width:100%; border:1px solid var(--border); border-radius:7px; padding:9px 11px; background:var(--surface-alt);
}
.field textarea{ resize:vertical; min-height:80px; }
.field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; background:var(--surface); }
.hint{ font-size:11.3px; color:var(--ink-faint); margin-top:4px; }

.badge{ display:inline-flex; align-items:center; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; white-space:nowrap; }
.badge-open{ background:var(--st-open-soft); color:var(--st-open); }
.badge-prog{ background:var(--st-prog-soft); color:var(--st-prog); }
.badge-next{ background:var(--st-next-soft); color:var(--st-next); }
.badge-res{ background:var(--st-res-soft); color:var(--st-res); }
.badge-closed{ background:var(--st-closed-soft); color:var(--st-closed); }
.pri-critical{ background:var(--critical-soft); color:var(--critical); }
.pri-high{ background:var(--high-soft); color:var(--high); }
.pri-medium{ background:var(--medium-soft); color:var(--medium); }
.pri-low{ background:var(--low-soft); color:var(--low); }

table{ width:100%; border-collapse:collapse; }
th{ text-align:left; font-size:10.8px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-faint); padding:9px 12px; border-bottom:1px solid var(--border); font-weight:600; }
td{ padding:11px 12px; border-bottom:1px solid var(--border-soft); font-size:13px; vertical-align:middle; }
tr.row-click{ cursor:pointer; }
tr.row-click:hover td{ background:var(--surface-alt); }
.tid{ font-family:var(--font-mono); font-weight:600; font-size:12.3px; color:var(--accent-dark); }
.muted{ color:var(--ink-soft); }
.faint{ color:var(--ink-faint); }
.mono{ font-family:var(--font-mono); }

.filters{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
.filters select, .filters input{ border:1px solid var(--border); border-radius:7px; padding:7px 10px; background:var(--surface); font-size:12.5px; }
.filters input{ flex:1; min-width:160px; }
.inline-select{ border:1px solid var(--border); border-radius:6px; padding:4px 7px; font-size:11.8px; background:var(--surface); }

.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:16px; }
.tab{ padding:9px 14px; font-size:12.8px; font-weight:500; color:var(--ink-soft); border:none; background:none; border-bottom:2px solid transparent; margin-bottom:-1px; }
.tab.active{ color:var(--accent-dark); border-bottom-color:var(--accent); font-weight:600; }

.back-link{ display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--ink-soft); background:none; border:none; margin-bottom:14px; padding:0; }
.back-link:hover{ color:var(--ink); }

/* Status rail — signature element */
.rail{ display:flex; align-items:center; margin:6px 0 22px; }
.rail-step{ display:flex; flex-direction:column; align-items:center; flex:1; position:relative; }
.rail-node{
  width:26px;height:26px; border-radius:50%; background:var(--surface-alt); border:2px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--ink-faint); z-index:2;
}
.rail-step.done .rail-node{ background:var(--accent); border-color:var(--accent); color:#fff; }
.rail-step.current .rail-node{ background:var(--surface); border-color:var(--accent); color:var(--accent-dark); box-shadow:0 0 0 3px var(--accent-soft); }
.rail-line{ position:absolute; top:12px; left:calc(-50% + 13px); width:calc(100% - 26px); height:2px; background:var(--border); z-index:1; }
.rail-step.done .rail-line, .rail-step.current .rail-line{ background:var(--accent); }
.rail-step:first-child .rail-line{ display:none; }
.rail-label{ font-size:10.3px; color:var(--ink-faint); margin-top:6px; font-weight:600; letter-spacing:0.3px; text-align:center; }
.rail-step.done .rail-label, .rail-step.current .rail-label{ color:var(--ink); }

.detail-grid{ display:grid; grid-template-columns:1fr 300px; gap:16px; align-items:start; }
.info-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border-soft); font-size:12.8px; }
.info-row:last-child{ border-bottom:none; }
.info-row .k{ color:var(--ink-soft); }
.info-row .v{ font-weight:500; text-align:right; }

.comment{ padding:12px 0; border-bottom:1px solid var(--border-soft); }
.comment:last-child{ border-bottom:none; }
.comment-head{ display:flex; align-items:center; gap:7px; margin-bottom:4px; }
.comment-author{ font-weight:600; font-size:12.6px; }
.comment-role{ font-size:10px; color:var(--ink-faint); font-family:var(--font-mono); }
.comment-time{ font-size:10.8px; color:var(--ink-faint); margin-left:auto; font-family:var(--font-mono); }
.comment-text{ font-size:12.8px; color:var(--ink); line-height:1.6; }
.comment.internal{ background:var(--medium-soft); margin:0 -12px 10px; padding:10px 12px; border-radius:7px; border-bottom:none; }
.internal-tag{ background:var(--medium); color:#fff; font-size:9px; padding:1px 6px; border-radius:4px; font-weight:600; letter-spacing:0.3px; }

.activity-item{ display:flex; gap:9px; padding:7px 0; font-size:12px; }
.activity-dot{ width:6px;height:6px;border-radius:50%; background:var(--accent); margin-top:5px; flex-shrink:0; }
.activity-text{ color:var(--ink); }
.activity-time{ color:var(--ink-faint); font-size:10.6px; font-family:var(--font-mono); margin-top:1px; }

.bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
.bar-label{ width:108px; font-size:12px; color:var(--ink-soft); flex-shrink:0; }
.bar-track{ flex:1; background:var(--surface-alt); border-radius:5px; height:9px; overflow:hidden; }
.bar-fill{ height:100%; background:var(--accent); border-radius:5px; }
.bar-num{ width:26px; text-align:right; font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); }

.section-title{ font-size:13.5px; font-weight:600; margin:0 0 12px; }
.empty{ text-align:center; padding:40px 20px; color:var(--ink-faint); font-size:13px; }

.banner{ display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border-radius:8px; font-size:12.6px; margin-bottom:16px; }
.banner-closed{ background:var(--st-closed-soft); color:var(--ink-soft); border:1px solid var(--border); }
.banner-warn{ background:var(--high-soft); color:var(--high); }

.checkbox-row{ display:flex; align-items:center; gap:7px; font-size:12.3px; color:var(--ink-soft); margin-top:8px; }
.pill-toggle{ display:flex; gap:6px; }
.pill-toggle button{ padding:6px 12px; border-radius:7px; border:1px solid var(--border); background:var(--surface); font-size:12px; }
.pill-toggle button.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

/* ---------- Auth ---------- */
.auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); padding:20px; }
.auth-card{ width:380px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:30px 26px; }
.auth-brand{ display:flex; align-items:center; gap:11px; margin-bottom:22px; }
.auth-brand .brand-mark{ width:38px; height:38px; border:1px solid var(--border); }
.auth-tabs{ display:flex; gap:3px; margin-bottom:20px; background:var(--surface-alt); border-radius:8px; padding:3px; }
.auth-tab{ flex:1; padding:8px; border-radius:6px; border:none; background:none; font-size:12.6px; font-weight:600; color:var(--ink-soft); }
.auth-tab.active{ background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(19,26,43,0.08); }
.auth-link{ background:none; border:none; color:var(--accent-dark); font-size:12.2px; padding:0; font-weight:600; }
.auth-foot{ text-align:center; margin-top:16px; font-size:12.2px; color:var(--ink-soft); }
.auth-error{ background:var(--critical-soft); color:var(--critical); padding:9px 11px; border-radius:7px; font-size:12.2px; margin-bottom:14px; }
.auth-success{ background:var(--accent-soft); color:var(--accent-dark); padding:9px 11px; border-radius:7px; font-size:12.2px; margin-bottom:14px; }
.logout-btn{ display:flex; align-items:center; gap:6px; padding:6px 11px; border-radius:8px; border:1px solid var(--border); background:var(--surface-alt); font-size:12.3px; font-weight:500; }
.logout-btn:hover{ border-color:var(--critical); color:var(--critical); }

.password-wrap{ position:relative; }
.password-wrap input{ padding-right:56px !important; }
.password-toggle{
  position:absolute; right:5px; top:50%; transform:translateY(-50%);
  background:none; border:none; font-size:11px; font-weight:600; color:var(--accent-dark);
  padding:6px 8px; border-radius:5px; letter-spacing:0.2px;
}
.password-toggle:hover{ background:var(--accent-soft); }
.password-match{ font-size:11.3px; margin-top:5px; }
.password-match.ok{ color:var(--st-res); }
.password-match.bad{ color:var(--critical); }
</style>
</head>

<div id="app"></div>

<!-- ================= SUPABASE CONFIG =================
     Fill these in from Supabase Dashboard → Project Settings → API.
     SUPABASE_ANON_KEY is the public "anon" key — safe to expose in
     frontend code (Row Level Security is what actually protects data).
     Never put the "service_role" secret key in this file. -->
<script>
 const SUPABASE_URL = 'https://fofwjduyfvoaurnhhvkd.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_P5PG4CUBMQEL01sxoet5vg_IJU5bKkk';
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>

const NOW = new Date();

const SUBCATEGORIES = ['General issue','Not working','Configuration','Installation request','Repair needed','Other'];

const STATUS_SEQ = ['OPEN','IN_PROGRESS','NEXT_UP','RESOLVED','CLOSED'];
const STATUS_LABEL = { OPEN:'Open', IN_PROGRESS:'In progress', NEXT_UP:'Next up', RESOLVED:'Resolved', CLOSED:'Closed' };

/* All of these now come from Supabase (see loadAllData below) instead of
   being hardcoded here. They start empty and are populated after login. */
let tickets = [];
let users = [];
function getTechnicians(){ return users.filter(u => u.role === 'Technician' && u.status === 'active'); }

let passwordResets = [];

const ASSET_CATEGORIES = ['Laptop','Desktop','Monitor','Printer','Phone','Networking','Peripheral','Accessory','ID Card','Software License','Furniture','Other'];
const ASSET_STATUSES = ['In Use','In Stock','Under Repair','Retired','Lost'];
const LOCATIONS = ['Hyderabad','Bangalore','Noida','Remote','Others'];

let assets = [];

let auditLog = [];

let notifications = {
  user: [],
  technician: [],
  admin: [],
  assetmanager: [],
};

/* ================= SUPABASE DATA LAYER =================
   Everything now lives in Postgres (see schema.sql). loadAllData() fetches
   the tables this signed-in user is allowed to see (enforced by Row Level
   Security policies, not by this code) and rebuilds the same in-memory
   shapes (tickets/users/assets/auditLog/notifications) the rest of the UI
   already expects, then re-renders. Every mutation below writes to
   Supabase first, then calls loadAllData() to refresh the screen — so the
   UI is always showing what's actually in the database. */

async function loadAllData(){
  const [profilesRes, ticketsRes, commentsRes, activityRes, assetsRes, auditRes, notifRes] = await Promise.all([
    sb.from('profiles').select('*'),
    sb.from('tickets').select('*'),
    sb.from('ticket_comments').select('*'),
    sb.from('ticket_activity').select('*'),
    sb.from('assets').select('*'),
    sb.from('audit_log').select('*').order('timestamp', { ascending:false }),
    sb.from('notifications').select('*').order('time', { ascending:false }),
  ]);
  [profilesRes, ticketsRes, commentsRes, activityRes, assetsRes, auditRes, notifRes].forEach(r => {
    if (r.error) console.error('Supabase load error:', r.error.message);
  });

  users = (profilesRes.data || []).map(u => ({
    id: u.id, name: u.name, email: u.email, dept: u.dept, role: u.role, status: u.status,
    isSuperAdmin: !!u.is_super_admin, assetLocations: u.asset_locations || [],
    lastActive: u.last_active ? new Date(u.last_active) : null,
    requestedAt: u.requested_at ? new Date(u.requested_at) : null,
  }));
  const userById = Object.fromEntries(users.map(u => [u.id, u]));

  const commentsByTicket = {}, activityByTicket = {};
  (commentsRes.data || []).forEach(c => (commentsByTicket[c.ticket_id] ||= []).push(
    { author:c.author_name, role:c.role, internal:!!c.internal, text:c.text, timestamp:new Date(c.timestamp) }));
  (activityRes.data || []).forEach(a => (activityByTicket[a.ticket_id] ||= []).push(
    { actor:a.actor, action:a.action, timestamp:new Date(a.timestamp) }));

  tickets = (ticketsRes.data || []).map(t => ({
    id:t.id, subject:t.subject, category:t.category, subcategory:t.subcategory,
    priority:t.priority, status:t.status, description:t.description, location:t.location, department:t.department,
    createdBy: { id:t.created_by, name: userById[t.created_by] ? userById[t.created_by].name : '—' },
    assignedTo: t.assigned_to ? { id:t.assigned_to, name: userById[t.assigned_to] ? userById[t.assigned_to].name : '—' } : null,
    createdAt:new Date(t.created_at), updatedAt:new Date(t.updated_at),
    slaDeadline: t.sla_deadline ? new Date(t.sla_deadline) : null,
    resolutionNotes: t.resolution_notes || '', attachment: t.attachment || '',
    comments: (commentsByTicket[t.id]||[]).sort((a,b)=>a.timestamp-b.timestamp),
    activity: (activityByTicket[t.id]||[]).sort((a,b)=>a.timestamp-b.timestamp),
  }));

  assets = (assetsRes.data || []).map(a => ({
    id:a.id, name:a.name, category:a.category, serialNumber:a.serial_number, assignedTo:a.assigned_to || '',
    department:a.department, location:a.location, status:a.status, vendor:a.vendor,
    joiningDate: a.joining_date ? new Date(a.joining_date) : null,
    assetAllotDate: a.asset_allot_date ? new Date(a.asset_allot_date) : null,
    exitDate: a.exit_date ? new Date(a.exit_date) : null, notes: a.notes || '',
  }));

  auditLog = (auditRes.data || []).map(a => ({
    timestamp:new Date(a.timestamp), user:a.user_name, role:a.role, action:a.action,
    ticketId:a.ticket_id, oldValue:a.old_value, newValue:a.new_value,
  }));

  notifications = { user:[], technician:[], admin:[], assetmanager:[] };
  (notifRes.data || []).forEach(n => {
    if (!notifications[n.role]) notifications[n.role] = [];

/* Session restore: Supabase Auth keeps its own session in localStorage and
   refreshes it automatically, so a page reload just needs to ask it "am I
   still logged in?" — no custom session code needed. */
async function restoreSession(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ render(); return; }
  const { data:profile, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if (error || !profile || profile.status !== 'active'){
    // signed in with Supabase but not an approved/active app user (e.g. still pending, or disabled)
    if (profile && profile.status === 'pending') state.authError = 'Your registration is still pending admin approval.';
    if (profile && profile.status === 'disabled') state.authError = 'This account has been disabled. Contact an administrator.';
    await sb.auth.signOut();
    render();
    return;
  }
  state.authenticated = true;
  state.currentUserId = profile.id;
  state.role = roleKeyFor(profile.role);
  state.view = defaultViewFor(state.role);
  await sb.from('profiles').update({ last_active: new Date().toISOString() }).eq('id', profile.id);
  await loadAllData();
  setupRealtime();
}

/* ================= REALTIME =================
   Without this, everyone only ever sees their OWN changes until they hit
   refresh — a new ticket from a coworker, an approval, a status change,
   etc. wouldn't show up until reload. This subscribes to every table and
   quietly re-fetches + re-renders whenever anything changes anywhere,
   for anyone logged in. Requires running, once, in Supabase SQL Editor:
     alter publication supabase_realtime add table
       tickets, ticket_comments, ticket_activity, profiles, assets,
       notifications, audit_log; */
let realtimeChannel = null;
let realtimeReloadTimer = null;
function scheduleRealtimeReload(){
  // Debounced: several changes landing at once (e.g. a ticket + its
  // activity row) only trigger one reload, not one per row.
  clearTimeout(realtimeReloadTimer);
  realtimeReloadTimer = setTimeout(() => { if (state.authenticated) loadAllData(); }, 400);
}
function setupRealtime(){
  if (realtimeChannel) return; // already listening
  realtimeChannel = sb.channel('itdesk-live-updates');
  ['tickets','ticket_comments','ticket_activity','profiles','assets','notifications','audit_log'].forEach(table => {
    realtimeChannel.on('postgres_changes', { event:'*', schema:'public', table }, scheduleRealtimeReload);
  });
  realtimeChannel.subscribe();
}
function teardownRealtime(){
  if (realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel = null; }
  clearTimeout(realtimeReloadTimer);
}

async function attemptLogin(){
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const password = document.getElementById('login-password').value;
  if (!email || !password){ state.authError = 'Enter your email and password.'; render(); return; }
  state.authError = 'Signing in…'; render();
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error){ state.authError = 'Login failed: ' + error.message + ' (code: ' + (error.status||'?') + ')'; render(); return; }
  const { data:profile, error: pErr } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
  if (pErr || !profile){ state.authError = 'Could not load your account: ' + (pErr ? pErr.message : 'no profile row found') + '.'; await sb.auth.signOut(); render(); return; }
  if (profile.status === 'disabled'){ state.authError = 'This account has been disabled. Contact an administrator.'; await sb.auth.signOut(); render(); return; }
  if (profile.status === 'pending'){ state.authError = 'Your registration is still pending admin approval.'; await sb.auth.signOut(); render(); return; }
  state.authenticated = true;
  state.authError = '';
  state.currentUserId = profile.id;
  await sb.from('profiles').update({ last_active:new Date().toISOString() }).eq('id', profile.id);
  switchRole(roleKeyFor(profile.role));
  await loadAllData();
  setupRealtime();
}

async function doSignup(){
  const name = document.getElementById('su-name').value.trim();
  const email = document.getElementById('su-email').value.trim().toLowerCase();
  const dept = document.getElementById('su-dept').value.trim();
  const pw = document.getElementById('su-password').value;
  const pw2 = document.getElementById('su-confirm').value;
  if (!name || !email || !dept || !pw || !pw2){ state.authError = 'Fill in every field to create an account.'; render(); return; }
  if (pw !== pw2){ state.authError = 'Passwords don\'t match.'; render(); return; }
  if (pw.length < 6){ state.authError = 'Password must be at least 6 characters.'; render(); return; }
  state.authError = 'Creating account…'; render();
  // Supabase Auth creates the login; a database trigger (see schema.sql)
  // automatically creates the matching "pending" profile row.
  const { data, error } = await sb.auth.signUp({
    email, password: pw, options: { data: { name, dept } },
  });
  if (error){
    state.authError = error.message.includes('already registered') || error.message.includes('exists')
      ? 'An account with this email already exists.' : error.message;
    render(); return;
  }
  await sb.from('notifications').insert({ role:'admin', text:'New registration pending: ' + name });
  // Signing up can auto-create a session; sign back out since the account
  // still needs admin approval before it's usable.
  await sb.auth.signOut();
  state.authView = 'signup-done';
  state.authError = '';
  render();
}

function fmtDateTime(d){

}
function fmtRelative(d){
  const mins = Math.round((NOW - d) / 60000);
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins/60);
  if (hrs < 24) return hrs + 'h ago';
  return Math.round(hrs/24) + 'd ago';
}

/* ================= MODAL (replaces native prompt/alert/confirm — those get
   silently blocked inside sandboxed iframe previews, which is why buttons
   that used them could look "broken") ================= */
function openModal(cfg){
  state.modal = cfg;
  render();
  const el = document.getElementById('modal-input');
  if (el) el.focus();
}
function closeModal(){ state.modal = null; render(); }

function confirmModal(){
  const m = state.modal;
  if (!m) return;
  if (m.kind === 'confirm-delete-asset'){
    doDeleteAsset(m.targetId);
  } else if (m.kind === 'edit-user'){
    const name = document.getElementById('modal-name').value.trim();
    const email = document.getElementById('modal-email').value.trim().toLowerCase();
    const dept = document.getElementById('modal-dept').value.trim();
    const err = document.getElementById('modal-error');
    const showErr = (msg) => { if (err){ err.style.display='block'; err.innerText = msg; } };
    if (!name || !email){ showErr('Name and email are required.'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showErr('Enter a valid email address.'); return; }
    const dup = users.find(u => u.id !== m.targetId && u.email === email);
    if (dup){ showErr('Another account already uses that email.'); return; }
    doEditUser(m.targetId, name, email, dept);
    return;
  } else if (m.kind === 'info'){
    closeModal();
    return;
  }
  closeModal();
}

function modalHtml(){
  const m = state.modal;
  if (!m) return '';
  let body = '';
  if (m.kind === 'set-password'){
    body = '<div class="field" style="margin-bottom:4px"><label>New password</label><input type="text" id="modal-input" placeholder="Enter a new password" autocomplete="off"></div>' +
      '<div id="modal-error" class="hint" style="display:none;color:var(--critical);margin-bottom:8px">Enter a password first.</div>';

    body = '<div class="modal-copybox">'+esc(m.copyValue)+'</div><div class="hint">Tap to select, then copy.</div>';
  }
  if (m.kind === 'edit-user'){
    body = '<div class="field"><label>Name</label><input type="text" id="modal-name" value="'+esc(m.presetName||'')+'"></div>' +
      '<div class="field"><label>Email</label><input type="text" id="modal-email" value="'+esc(m.presetEmail||'')+'"></div>' +
      '<div class="field" style="margin-bottom:4px"><label>Department</label><input type="text" id="modal-dept" value="'+esc(m.presetDept||'')+'"></div>' +
      '<div id="modal-error" class="hint" style="display:none;color:var(--critical);margin-bottom:8px"></div>';
  }
  const singleButton = m.kind === 'info';
  return '<div class="modal-overlay" onclick="if(event.target===this) closeModal()">' +
    '<div class="modal-card">' +
      '<div class="modal-title">'+esc(m.title)+'</div>' +
      (m.message ? '<div class="modal-message">'+esc(m.message)+'</div>' : '') +
      body +

        (singleButton ? '' : '<button class="btn" onclick="closeModal()">Cancel</button>') +
        '<button class="btn btn-primary" onclick="confirmModal()">' + (m.confirmLabel || (singleButton ? 'OK' : 'Confirm')) + '</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

async function submitNewTicket(){
  const subject = document.getElementById('nf-subject').value.trim();
  const category = document.getElementById('nf-category').value;
  const subcategory = document.getElementById('nf-subcategory').value;
  const priority = document.getElementById('nf-priority').value;
  const description = document.getElementById('nf-description').value.trim();
  const location = document.getElementById('nf-location').value.trim();
  const attachmentInput = document.getElementById('nf-attachment');
  const errEl = document.getElementById('nf-error');

  if (!subject || !category || !priority || !description){
    errEl.style.display = 'block';
    errEl.innerText = 'Please fill in subject, category, priority and description before submitting.';
    return;
  }
  errEl.style.display = 'none';

  const user = currentPersona();
  const attachment = (attachmentInput.files && attachmentInput.files[0]) ? attachmentInput.files[0].name : null;
  const slaDeadline = new Date(Date.now() + SLA_HOURS[priority]*3600*1000).toISOString();

  const { data:t, error } = await sb.from('tickets').insert({
    subject, category, subcategory: subcategory || 'General issue', priority, description,
    attachment, location: location || 'Not specified', department: user.dept,
    created_by: user.id, status:'OPEN', sla_deadline: slaDeadline,
  }).select().single();
  if (error){ errEl.style.display='block'; errEl.innerText = 'Could not create ticket: ' + error.message; return; }

  await sb.from('ticket_activity').insert({ ticket_id:t.id, actor:user.name, action:'Created ticket' });
  await logAuditRemote('Created ticket', t.id, '—', 'Open');
  await notifyRemote('admin', 'New ticket ' + t.id + ' raised by ' + user.name + (priority==='Critical' ? ' — Critical priority' : ''));
  await notifyRemote('user', 'Ticket ' + t.id + ' was created and is now open');

  state.view = 'ticket-created';
  state.selectedTicketId = t.id;
  await loadAllData();
}

  await sb.from('ticket_comments').insert({ ticket_id:id, author_id:actor.id, author_name:actor.name, role:roleLabel, internal, text });

async function changeStatus(id, newStatus, resolutionNotes){
  const t = getTicket(id);

  const old = STATUS_LABEL[t.status];
  const patch = { status:newStatus, updated_at:new Date().toISOString() };
  if (resolutionNotes !== undefined) patch.resolution_notes = resolutionNotes;
  await sb.from('tickets').update(patch).eq('id', id);
  await sb.from('ticket_activity').insert({ ticket_id:id, actor:actor.name, action:'Status changed: ' + old + ' → ' + STATUS_LABEL[newStatus] });
  await logAuditRemote('Status change', id, old, STATUS_LABEL[newStatus]);
  await notifyRemote('user', 'Ticket ' + id + ' status changed to ' + STATUS_LABEL[newStatus]);
  if (newStatus === 'RESOLVED') await notifyRemote('user', 'Your ticket ' + id + ' was marked resolved');
  if (newStatus === 'CLOSED') await notifyRemote('user', 'Your ticket ' + id + ' was closed');
  await loadAllData();

async function transferSuperAdmin(id){
  if (!isCurrentUserSuperAdmin()) return;
  const target = users.find(x=>x.id===id);
  if (!target || target.role !== 'Admin') return;
  const previous = getSuperAdmin();
  if (previous) await sb.from('profiles').update({ is_super_admin:false }).eq('id', previous.id);
  await sb.from('profiles').update({ is_super_admin:true }).eq('id', target.id);
  await logAuditRemote('Transferred Super Admin access', '—', previous ? previous.name : '—', target.name);
  await notifyRemote('admin', 'Super Admin access transferred to ' + target.name);
  await loadAllData();
}

   service-role secret key, which must never be used client-side. If you
   want a "reset on behalf of a user" admin button, it needs a small
   server-side function (Supabase Edge Function) using that key. */
async function adminResendReset(id){
  const u = users.find(x=>x.id===id);
  if (!u) return;
  await sb.auth.resetPasswordForEmail(u.email, { redirectTo: window.location.href });
  await logAuditRemote('Sent password reset email', '—', '—', u.name);
  openModal({ kind:'info', title:'Reset email sent', message:'A password reset link was emailed to ' + u.name + ' (' + u.email + ').' });
}

/* CSV import */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  text = text.replace(/^\ufeff/, '');
  for (let i = 0; i < text.length; i++){
    const c = text[i], next = text[i+1];
    if (inQuotes){
      if (c === '"' && next === '"'){ field += '"'; i++; }
      else if (c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\r'){ /* skip */ }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length===1 && r[0] !== ''));
}

const ASSET_CSV_FIELD_MAP = {
  'asset id':'id', 'name':'name', 'category':'category', 'serial number':'serialNumber',
  'assigned to':'assignedTo', 'department':'department', 'location':'location', 'status':'status',
  'vendor':'vendor', 'joining date':'joiningDate', 'asset allot date':'assetAllotDate', 'exit date':'exitDate', 'notes':'notes',
};

function triggerAssetImport(){
  const input = document.getElementById('asset-import-file');
  if (!input.files || !input.files[0]){
    state.assetImportMsg = { type:'error', text:'Choose a CSV file first.' };
    render();
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e){
    processAssetImport(e.target.result);
  };
  reader.onerror = function(){
    state.assetImportMsg = { type:'error', text:'Could not read that file.' };
    render();
  };
  reader.readAsText(input.files[0]);
}

async function processAssetImport(text){
  const rows = parseCSV(text);
  if (!rows.length){
    state.assetImportMsg = { type:'error', text:'That file looks empty.' };
    render();
    return;
  }
  const header = rows[0].map(h => h.trim().toLowerCase());
  const idx = {};
  header.forEach((h, i) => { if (ASSET_CSV_FIELD_MAP[h]) idx[ASSET_CSV_FIELD_MAP[h]] = i; });
  if (idx.name === undefined){
    state.assetImportMsg = { type:'error', text:'Couldn\'t find a "Name" column — check the file matches the exported format.' };
    render();
    return;
  }

  let added = 0, updated = 0, skipped = 0;
  for (let r = 1; r < rows.length; r++){
    const row = rows[r];
    const get = (key) => idx[key] !== undefined ? (row[idx[key]] || '').trim() : '';
    const name = get('name');
    if (!name){ skipped++; continue; }
    const dataRow = {
      name,
      category: ASSET_CATEGORIES.includes(get('category')) ? get('category') : 'Other',
      serial_number: get('serialNumber'),
      assigned_to: get('assignedTo'),
      department: get('department'),
      location: get('location'),
      status: ASSET_STATUSES.includes(get('status')) ? get('status') : 'In Stock',
      vendor: get('vendor'),
      joining_date: get('joiningDate') || null,
      asset_allot_date: get('assetAllotDate') || null,
      exit_date: get('exitDate') || null,
      notes: get('notes'),
    };
    const providedId = get('id');
    const existing = providedId ? assets.find(a => a.id === providedId) : null;
    if (existing){
      await sb.from('assets').update(dataRow).eq('id', existing.id);
      updated++;
    } else if (providedId){
      await sb.from('assets').insert(Object.assign({ id:providedId }, dataRow));
      added++;
    } else {
      await sb.from('assets').insert(dataRow);
      added++;
    }
  }
  await logAuditRemote('Imported assets from CSV', '—', '—', added + ' added, ' + updated + ' updated');
  await loadAllData();
  state.assetImportMsg = { type:'success', text:'Import complete — ' + added + ' added, ' + updated + ' updated' + (skipped ? ', ' + skipped + ' row(s) skipped (missing name)' : '') + '.' };
  render();
}

    '<div class="info-row"><span class="k">Email</span><span class="v mono" style="font-size:12px">'+email+'</span></div>' +
    '<div class="info-row"><span class="k">Role</span><span class="v">'+roleLabel(state.role)+'</span></div>';

  html += '</div>';
  return html;
}

/* ---------- Ticket detail ---------- */
function railHtml(status){
  const idx = STATUS_SEQ.indexOf(status);
  return '<div class="rail">' + STATUS_SEQ.map((s,i) => {
    const cls = i < idx ? 'done' : (i === idx ? 'current' : '');
    return '<div class="rail-step '+cls+'"><div class="rail-line"></div><div class="rail-node">'+(i<idx?'✓':(i+1))+'</div><div class="rail-label">'+STATUS_LABEL[s]+'</div></div>';
  }).join('') + '</div>';
}

function ticketDetailHtml(id){
  const t = getTicket(id);
  if (!t) return '<div class="card empty">Ticket not found.</div>';
  const role = state.role;
  const isOwner = role === 'user' && t.createdBy.id === currentPersona().id;
  const isAssignedTech = role === 'technician' && t.assignedTo && t.assignedTo.id === currentPersona().id;
  const isAdmin = role === 'admin';
  const canManage = isAdmin || isAssignedTech;

  let backView = role === 'admin' ? 'admin-tickets' : (role === 'technician' ? 'tech-assigned' : 'my-tickets');

  let html = '<button class="back-link" onclick="switchView(\''+backView+'\')">&larr; Back</button>';

  html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">' +
    '<div><span class="tid" style="font-size:14px">'+t.id+'</span> <span class="badge '+PRI_BADGE[t.priority]+'" style="margin-left:8px">'+t.priority+'</span></div>' +
    '</div>' +
    '<div style="font-size:18px;font-weight:600;margin:6px 0 18px">'+esc(t.subject)+'</div>';

  if (t.status === 'CLOSED' && role === 'user'){
    html += '<div class="banner banner-closed">This ticket is closed and can\'t be reopened. If the issue comes back, please raise a new ticket. <button class="btn btn-sm" style="margin-left:auto" onclick="switchView(\'new-ticket\')">Raise new ticket</button></div>';
  }

  html += railHtml(t.status);

  html += '<div class="detail-grid">';

  /* left column */
  html += '<div>';
  html += '<div class="card" style="margin-bottom:14px">' +
    '<div class="section-title">Description</div>' +
    '<div style="font-size:13px;line-height:1.7;color:var(--ink)">'+esc(t.description)+'</div>' +
    (t.attachment ? '<div class="hint" style="margin-top:10px">📎 '+esc(t.attachment)+'</div>' : '') +
    '</div>';

  if (t.resolutionNotes){
    html += '<div class="card" style="margin-bottom:14px;border-color:var(--st-res)">' +
      '<div class="section-title" style="color:var(--st-res)">Resolution notes</div>' +
      '<div style="font-size:13px;line-height:1.6">'+esc(t.resolutionNotes)+'</div></div>';
  }

  /* comments */
  const visibleComments = t.comments.filter(c => role !== 'user' || !c.internal);
  html += '<div class="card" style="margin-bottom:14px">' +
    '<div class="section-title">Comments ('+visibleComments.length+')</div>';
  if (visibleComments.length){
    html += visibleComments.map(c => (
      '<div class="comment '+(c.internal?'internal':'')+'">' +
        '<div class="comment-head"><span class="comment-author">'+esc(c.author)+'</span><span class="comment-role">'+c.role+'</span>' + (c.internal?'<span class="internal-tag">INTERNAL</span>':'') + '<span class="comment-time">'+fmtRelative(c.timestamp)+'</span></div>' +
        '<div class="comment-text">'+esc(c.text)+'</div>' +
      '</div>'
    )).join('');
  } else {
    html += '<div class="muted" style="font-size:12.5px">No comments yet.</div>';
  }

  if (t.status !== 'CLOSED'){
    html += '<div style="margin-top:14px;border-top:1px solid var(--border-soft);padding-top:14px">' +
      '<textarea id="comment-box" placeholder="'+(role==='user'?'Add more information for the technician…':'Add a comment…')+'" style="width:100%;border:1px solid var(--border);border-radius:7px;padding:9px 11px;min-height:64px;background:var(--surface-alt)"></textarea>';
    if (role !== 'user'){
      html += '<label class="checkbox-row"><input type="checkbox" id="comment-internal"> Internal note (hidden from the user)</label>';
    }
    html += '<button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="addCommentToTicket(\''+t.id+'\')">Post comment</button>';
    html += '</div>';
  }
  html += '</div>';

  /* activity */
  html += '<div class="card">' +
    '<div class="section-title">Activity history</div>' +
    t.activity.slice().reverse().map(a => (
      '<div class="activity-item"><span class="activity-dot"></span><div><div class="activity-text">'+esc(a.actor)+' — '+esc(a.action)+'</div><div class="activity-time">'+fmtDateTime(a.timestamp)+'</div></div></div>'
    )).join('') +
  '</div>';

  html += '</div>'; /* end left col */

  /* right column */
  html += '<div>';
  html += '<div class="card" style="margin-bottom:14px">' +
    '<div class="section-title">Ticket information</div>' +
    '<div class="info-row"><span class="k">Created by</span><span class="v">'+esc(t.createdBy.name)+'</span></div>' +
    '<div class="info-row"><span class="k">Department</span><span class="v">'+esc(t.department)+'</span></div>' +
    '<div class="info-row"><span class="k">Category</span><span class="v">'+esc(t.category)+'</span></div>' +
    '<div class="info-row"><span class="k">Sub-category</span><span class="v">'+esc(t.subcategory)+'</span></div>' +
    '<div class="info-row"><span class="k">Location</span><span class="v">'+esc(t.location)+'</span></div>' +
    '<div class="info-row"><span class="k">Created</span><span class="v mono" style="font-size:11.5px">'+fmtDateTime(t.createdAt)+'</span></div>' +
    '<div class="info-row"><span class="k">SLA deadline</span><span class="v mono" style="font-size:11.5px">'+fmtDateTime(t.slaDeadline)+'</span></div>' +
    '<div class="info-row"><span class="k">Assigned to</span><span class="v">'+(t.assignedTo?esc(t.assignedTo.name):'Unassigned')+'</span></div>' +
  '</div>';

  if (isAdmin){
    html += '<div class="card" style="margin-bottom:14px">' +
      '<div class="section-title">Admin controls</div>' +
      '<div class="field"><label>Assign technician</label><select onchange="assignTechnician(\''+t.id+'\', this.value)">' +
        '<option value="">Unassigned</option>' + getTechnicians().map(tech => '<option value="'+tech.id+'" '+(t.assignedTo&&t.assignedTo.id===tech.id?'selected':'')+'>'+tech.name+'</option>').join('') +
      '</select></div>' +
      '<div class="field"><label>Priority</label><select onchange="changePriority(\''+t.id+'\', this.value)">' +
        ['Low','Medium','High','Critical'].map(p=>'<option value="'+p+'" '+(t.priority===p?'selected':'')+'>'+p+'</option>').join('') +
      '</select></div>' +
      '<div class="field" style="margin-bottom:6px"><label>Category</label><select onchange="changeCategory(\''+t.id+'\', this.value)">' +
        CATEGORIES.map(c=>'<option value="'+c+'" '+(t.category===c?'selected':'')+'>'+c+'</option>').join('') +
      '</select></div>' +
    '</div>';
  }

  if (canManage && t.status !== 'CLOSED'){
    html += '<div class="card" style="margin-bottom:14px"><div class="section-title">Update status</div>';
    const idx = STATUS_SEQ.indexOf(t.status);
    if (t.status === 'OPEN') html += '<button class="btn btn-block" style="margin-bottom:8px" onclick="changeStatus(\''+t.id+'\',\'IN_PROGRESS\')">Start progress</button>';
    if (t.status === 'IN_PROGRESS') html += '<button class="btn btn-block" style="margin-bottom:8px" onclick="changeStatus(\''+t.id+'\',\'NEXT_UP\')">Move to next up</button>';
    if (t.status === 'NEXT_UP'){
      html += '<div class="field"><label>Resolution notes</label><textarea id="resolution-notes" placeholder="What was done to fix this?"></textarea></div>';
      html += '<button class="btn btn-primary btn-block" onclick="saveResolutionAndResolve(\''+t.id+'\')">Mark resolved</button>';
    }
    if (t.status === 'RESOLVED'){
      if (isAdmin || isAssignedTech){
        html += '<button class="btn btn-primary btn-block" onclick="changeStatus(\''+t.id+'\',\'CLOSED\')">Close ticket</button>';
      }
      html += '<button class="btn btn-block" style="margin-top:8px" onclick="changeStatus(\''+t.id+'\',\'NEXT_UP\')">Reopen to next up</button>';
    }
    html += '</div>';
  }

  if (isAdmin && t.status === 'CLOSED'){
    html += '<div class="card"><div class="section-title">Admin override</div>' +
      '<div class="hint" style="margin-bottom:10px">Users can\'t reopen closed tickets. As Admin you can reopen this one if needed.</div>' +
      '<button class="btn btn-block" onclick="reopenTicket(\''+t.id+'\')">Reopen ticket</button></div>';
  }

  if (isOwner && t.status !== 'CLOSED'){
    html += '<div class="card"><div class="hint">You\'ll be notified here as soon as this ticket\'s status changes.</div></div>';
  }

  html += '</div>'; /* end right col */
  html += '</div>'; /* end detail-grid */
  return html;
}

/* ---------- Technician assigned ---------- */
function techAssignedHtml(){
  const mine = tickets.filter(t => t.assignedTo && t.assignedTo.id === currentPersona().id).sort((a,b)=>b.updatedAt-a.updatedAt);
  const open = mine.filter(t=>t.status!=='CLOSED');
  const closed = mine.filter(t=>t.status==='CLOSED');
  let html = '<div class="grid grid-4" style="margin-bottom:18px">' +
    statCard('Open', mine.filter(t=>t.status==='OPEN').length, 'st-open') +
    statCard('In progress', mine.filter(t=>t.status==='IN_PROGRESS').length, 'st-prog') +
    statCard('Next up', mine.filter(t=>t.status==='NEXT_UP').length, 'st-next') +
    statCard('Resolved', mine.filter(t=>t.status==='RESOLVED').length, 'st-res') +

/* ---------- Admin dashboard ---------- */
function statCard(label, num, cls){
  return '<div class="stat-card '+cls+'"><div class="stat-num">'+num+'</div><div class="stat-label">'+label+'</div></div>';
}

function dashboardHtml(){
  const counts = { OPEN:0, IN_PROGRESS:0, NEXT_UP:0, RESOLVED:0, CLOSED:0 };
  tickets.forEach(t => counts[t.status]++);
  const total = tickets.length;
  const priCounts = { Critical:0, High:0, Medium:0, Low:0 };
  tickets.forEach(t => priCounts[t.priority]++);
  const catCounts = {};
  CATEGORIES.forEach(c => catCounts[c] = 0);
  tickets.forEach(t => catCounts[t.category]++);
  const maxCat = Math.max(1, ...Object.values(catCounts));
  const unassigned = tickets.filter(t => !t.assignedTo && t.status !== 'CLOSED').length;
  const overdue = tickets.filter(t => t.status !== 'CLOSED' && t.status !== 'RESOLVED' && t.slaDeadline < NOW).length;
  const today = tickets.filter(t => (NOW - t.createdAt) < 24*3600*1000).length;
  const resolvedTickets = tickets.filter(t => t.status === 'RESOLVED' || t.status === 'CLOSED');
  const avgResHrs = resolvedTickets.length ? Math.round(resolvedTickets.reduce((s,t)=> s + (t.updatedAt - t.createdAt)/3600000, 0) / resolvedTickets.length) : 0;

  let html = '<div class="grid grid-4" style="margin-bottom:14px">' +
    statCard('Open', counts.OPEN, 'st-open') +
    statCard('In progress', counts.IN_PROGRESS, 'st-prog') +
    statCard('Next up', counts.NEXT_UP, 'st-next') +
    statCard('Resolved', counts.RESOLVED, 'st-res') +
  '</div>';

  html += '<div class="grid grid-4" style="margin-bottom:22px">' +
    statCard('Closed', counts.CLOSED, '') +
    statCard('Total tickets', total, '') +
    statCard('Unassigned', unassigned, '') +
    statCard('SLA overdue', overdue, '') +
  '</div>';

  html += '<div class="grid grid-2" style="margin-bottom:16px">';
  html += '<div class="card"><div class="section-title">Tickets by priority</div>' +
    ['Critical','High','Medium','Low'].map(p => (
      '<div class="bar-row"><div class="bar-label">'+p+'</div><div class="bar-track"><div class="bar-fill" style="width:'+(priCounts[p]/Math.max(1,total)*100)+'%;background:var('+({Critical:'--critical',High:'--high',Medium:'--medium',Low:'--low'}[p])+')"></div></div><div class="bar-num">'+priCounts[p]+'</div></div>'
    )).join('') +
  '</div>';
  html += '<div class="card"><div class="section-title">Tickets by category</div>' +
    CATEGORIES.map(c => (
      '<div class="bar-row"><div class="bar-label">'+c+'</div><div class="bar-track"><div class="bar-fill" style="width:'+(catCounts[c]/maxCat*100)+'%"></div></div><div class="bar-num">'+catCounts[c]+'</div></div>'
    )).join('') +
  '</div>';
  html += '</div>';

  html += '<div class="grid grid-4" style="margin-bottom:16px">' +
    statCard('Avg resolution time', avgResHrs + 'h', '') +
    statCard("Today's tickets", today, '') +
    statCard('Technicians active', getTechnicians().length, '') +
    statCard('Departments touched', new Set(tickets.map(t=>t.department)).size, '') +
  '</div>';

  html += '<div class="card"><div class="section-title">Tickets per technician</div>' +
    getTechnicians().map(tech => {
      const n = tickets.filter(t=>t.assignedTo && t.assignedTo.id===tech.id && t.status!=='CLOSED').length;
      return '<div class="bar-row"><div class="bar-label">'+tech.name+'</div><div class="bar-track"><div class="bar-fill" style="width:'+(n/Math.max(1,total)*100*3)+'%"></div></div><div class="bar-num">'+n+'</div></div>';
    }).join('') +
  '</div>';

  return html;
}

/* ---------- Admin tickets ---------- */

      '<option value="all" '+(f.status==='all'?'selected':'')+'>All statuses</option>' +
      STATUS_SEQ.map(s=>'<option value="'+s+'" '+(f.status===s?'selected':'')+'>'+STATUS_LABEL[s]+'</option>').join('') +

    '<select onchange="setFilter(\'priority\', this.value)">' +
      '<option value="all" '+(f.priority==='all'?'selected':'')+'>All priorities</option>' +
      ['Critical','High','Medium','Low'].map(p=>'<option value="'+p+'" '+(f.priority===p?'selected':'')+'>'+p+'</option>').join('') +

    '<select onchange="setFilter(\'category\', this.value)">' +
      '<option value="all" '+(f.category==='all'?'selected':'')+'>All categories</option>' +
      CATEGORIES.map(c=>'<option value="'+c+'" '+(f.category===c?'selected':'')+'>'+c+'</option>').join('') +

  '</div>';

  html += '<div class="card" style="padding:0">' + (list.length ? ticketTableHtml(list, true) : '<div class="empty">No tickets match these filters.</div>') + '</div>';

    '</div>';
    html += active.length ? '<div class="card" style="padding:0"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Location</th><th>Super Admin</th><th>Department</th><th>Last active</th><th></th></tr></thead><tbody>' +
      active.map(u => (
        '<tr><td>'+esc(u.name)+'</td><td class="mono" style="font-size:12px">'+esc(u.email)+'</td>' +
        '<td><select class="inline-select" onchange="changeUserRole(\''+u.id+'\', this.value)">' +
          ['User','Technician','Admin','Asset Manager'].map(r => '<option value="'+r+'" '+(u.role===r?'selected':'')+'>'+r+'</option>').join('') +
        '</select></td>' +
        '<td>' + (u.role === 'Asset Manager' ?
          '<select class="inline-select" onchange="setUserAssetLocation(\''+u.id+'\', this.value)">' +
            '<option value="">— Choose —</option>' +
            LOCATIONS.map(l => '<option value="'+l+'" '+((u.assetLocations||[])[0]===l?'selected':'')+'>'+l+'</option>').join('') +
          '</select>' : '<span class="faint">—</span>') +
        '</td>' +
        '<td>' + (u.isSuperAdmin ? '<span class="badge badge-res">⭐ Super Admin</span>' :
          (iAmSuper && u.role === 'Admin' ? '<button class="btn btn-sm" onclick="transferSuperAdmin(\''+u.id+'\')">Make Super Admin</button>' : '<span class="faint">—</span>')) +
        '</td>' +
        '<td>'+esc(u.dept)+'</td><td class="faint">'+fmtRelative(u.lastActive)+'</td>' +
        '<td style="text-align:right;white-space:nowrap"><button class="btn btn-sm" style="margin-right:6px" onclick="editUserOpen(\''+u.id+'\')">Edit</button><button class="btn btn-sm" style="margin-right:6px" onclick="adminResendReset(\''+u.id+'\')">Send reset email</button><button class="btn btn-sm btn-danger" onclick="disableUser(\''+u.id+'\')" '+(u.isSuperAdmin?'disabled title="Transfer Super Admin to someone else first"':'')+'>Disable</button></td></tr>'
      )).join('') + '</tbody></table></div>' : '<div class="card empty">'+(q ? 'No active users match "'+esc(state.activeUsersQ)+'".' : 'No active users.')+'</div>';

}

/* ---------- CSV export ---------- */
function csvEscape(v){
  if (v === null || v === undefined) return '';
  const s = String(v);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function rowsToCSV(headers, rows){
  const lines = [headers.map(csvEscape).join(',')];
  rows.forEach(r => lines.push(r.map(csvEscape).join(',')));
  return lines.join('\r\n');
}
function isoOrBlank(d){ return d ? new Date(d).toISOString() : ''; }
function dateStamp(){ return new Date().toISOString().slice(0,10); }
function downloadCSV(filename, csvString){
  const blob = new Blob(['\ufeff' + csvString], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

    t.createdBy.name, isoOrBlank(t.createdAt), isoOrBlank(t.updatedAt), t.assignedTo ? t.assignedTo.name : '', isoOrBlank(t.slaDeadline),
    t.resolutionNotes || '', t.attachment || '',
    t.comments.map(c => (c.internal?'[internal] ':'') + c.author + ' (' + c.role + ') @ ' + isoOrBlank(c.timestamp) + ': ' + c.text).join(' | '),
    t.activity.map(a => isoOrBlank(a.timestamp) + ' - ' + a.actor + ': ' + a.action).join(' | '),
  ]);

/* ---------- Scheduled folder export (File System Access API) ---------- */
function fsAccessSupported(){ return typeof window.showDirectoryPicker === 'function'; }

async function chooseExportFolder(){
  if (!fsAccessSupported()){
    openModal({ kind:'info', title:"Can't pick a folder in this browser", message:'Direct folder access needs Chrome or Edge. In other browsers, scheduled exports will fall back to your regular Downloads folder — set that folder as the default download location in your browser settings instead.' });
    return;
  }
  try{
    const handle = await window.showDirectoryPicker();
    state.exportFolderHandle = handle;
    state.exportFolderName = handle.name;
    render();
  } catch(e){ /* user cancelled the picker — nothing to do */ }
}

function clearExportFolder(){
  state.exportFolderHandle = null;
  state.exportFolderName = null;
  render();
}

async function writeFileToFolder(filename, content){
  if (!state.exportFolderHandle) return false;
  try{
    const fileHandle = await state.exportFolderHandle.getFileHandle(filename, { create:true });
    const writable = await fileHandle.createWritable();
    await writable.write('\ufeff' + content);
    await writable.close();
    return true;
  } catch(e){
    console.error('writeFileToFolder failed', e);
    return false;
  }
}

async function runScheduledExport(isTest){
  const files = [
    ['Tickets.csv', buildTicketsCSV()],
    ['Users.csv', buildUsersCSV()],
    ['Assets.csv', buildAssetsCSV()],
    ['Password_Reset_Requests.csv', buildPasswordResetsCSV()],
    ['Technicians.csv', buildTechniciansCSV()],
    ['Audit_Log.csv', buildAuditLogCSV()],
  ];
  if (state.exportFolderHandle){
    let ok = 0;
    for (const [name, content] of files){
      if (await writeFileToFolder(name, content)) ok++;
    }
    if (isTest) openModal({ kind:'info', title:'Export complete', message:ok + ' of ' + files.length + ' files written to "' + state.exportFolderName + '".' });
  } else {
    files.forEach(([name, content], i) => setTimeout(() => downloadCSV(name, content), i * 200));
    if (isTest) openModal({ kind:'info', title:'Downloaded to your Downloads folder', message:"No export folder is selected, so files went to your browser's default download location instead. Choose a folder above to write there directly next time." });
  }
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

setInterval(function(){
  if (!state.dailyAutoExportEnabled) return;
  const now = new Date();
  if (now.getHours() === 18 && now.getMinutes() === 30 && state.lastAutoExportDate !== todayStr()){
    state.lastAutoExportDate = todayStr();
    runScheduledExport(false);
  }
}, 30000);

    '<div class="info-row"><span class="k">Current Super Admin</span><span class="v">' + (superAdmin ? '⭐ '+esc(superAdmin.name) : '— none —') + '</span></div>';

  if (iAmSuper){
    html += '<div class="hint" style="margin:10px 0">You hold Super Admin access. You can hand it to any other active Admin — they\'ll gain it immediately and you\'ll drop back to a regular Admin.</div>';
    if (otherAdmins.length){
      html += '<div class="field" style="margin-top:12px"><label>Transfer to</label><select id="sa-target">' +
        otherAdmins.map(u => '<option value="'+u.id+'">'+esc(u.name)+' — '+esc(u.email)+'</option>').join('') +
        '</select></div>' +
        '<button class="btn btn-primary" onclick="transferSuperAdmin(document.getElementById(\'sa-target\').value)">Transfer Super Admin access</button>';
    } else {
      html += '<div class="hint">No other Admins yet — promote someone to Admin in Users → Active Users first, then you can hand off Super Admin here.</div>';
    }
  } else {
    html += '<div class="hint" style="margin-top:10px">Only the current Super Admin can transfer this access. Ask ' + (superAdmin?esc(superAdmin.name):'the Super Admin') + ' to do it from this same screen, or from Users → Active Users.</div>';
  }
  html += '</div>';

  html += '<div class="card" style="max-width:560px">' +
    '<div class="section-title">System settings</div>' +
    (!iAmSuper ? '<div class="banner banner-warn">These are reserved for the Super Admin and appear read-only here.</div>' : '') +
    '<div class="info-row"><span class="k">Default SLA — Critical</span><span class="v">4 hours</span></div>' +
    '<div class="info-row"><span class="k">Default SLA — High</span><span class="v">8 hours</span></div>' +
    '<div class="info-row"><span class="k">Default SLA — Medium</span><span class="v">24 hours</span></div>' +
    '<div class="info-row"><span class="k">Default SLA — Low</span><span class="v">72 hours</span></div>' +
    '<div class="info-row"><span class="k">Allow users to reopen closed tickets</span><span class="v">Off</span></div>' +
    '<div class="info-row"><span class="k">Email notifications</span><span class="v">On</span></div>' +
  '</div>';

  html += '<div class="card" style="max-width:560px;margin-top:16px">' +
    '<div class="section-title">Scheduled daily export — 6:30 PM</div>' +
    '<div class="hint" style="margin-bottom:10px">Writes all six datasets as CSV files, automatically, every day at 6:30 PM — as long as this tab is open in a browser at that moment. Browsers can\'t write to an arbitrary folder path on their own, so pick the destination folder once below (Chrome or Edge only); other browsers will fall back to your regular Downloads folder.</div>' +
    (state.exportFolderName ?
      '<div class="info-row"><span class="k">Export folder</span><span class="v">📁 '+esc(state.exportFolderName)+'</span></div>' +
      '<div style="display:flex;gap:8px;margin:10px 0"><button class="btn btn-sm" onclick="chooseExportFolder()">Change folder</button><button class="btn btn-sm" onclick="clearExportFolder()">Clear</button></div>'
      : '<div style="margin:10px 0"><button class="btn" onclick="chooseExportFolder()">📁 Choose export folder…</button></div>') +
    '<label class="checkbox-row" style="font-size:13px;margin-bottom:12px"><input type="checkbox" '+(state.dailyAutoExportEnabled?'checked':'')+' onchange="toggleDailyAutoExport(this.checked)"> Automatically export every day at 6:30 PM</label>' +
    '<button class="btn btn-sm" onclick="runScheduledExport(true)">Export now (test)</button>' +
    '<div class="hint" style="margin-top:12px">Heads up: since everything here lives in this browser tab\'s memory (no server), the "6:30 PM" export only fires if this tab is open and this app is loaded at that moment — a closed browser can\'t run it. To land files in your exact OneDrive path automatically every day without keeping a tab open, you\'d eventually want a small real backend plus a scheduled task (e.g. Windows Task Scheduler) instead of a browser-only tool like this one.</div>' +
  '</div>';
  return html;
}

/* ================= INIT ================= */
restoreSession();
document.addEventListener('click', function(e){
  if (!e.target.closest('.role-switch') && (state.roleMenuOpen || state.notifOpen)){
    state.roleMenuOpen = false; state.notifOpen = false; render();
  }
}, true);

/* Enter key submits the current auth form (login / signup / forgot password),
   same as clicking the primary button — works from any field in the form. */
document.addEventListener('keydown', function(e){
  if (e.key !== 'Enter' || state.authenticated) return;
  const tag = e.target.tagName;
  if (tag !== 'INPUT') return; // don't hijack Enter inside textareas etc.
  e.preventDefault();
  if (state.authView === 'login') attemptLogin();
  else if (state.authView === 'signup') doSignup();
  else if (state.authView === 'forgot') doForgotPassword();
}, true);
</script>
